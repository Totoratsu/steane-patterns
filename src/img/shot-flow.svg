<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" font-family="sans-serif" font-size="15" role="img" aria-label="One shot: logical gates, encoding, R rounds of noise then 12 checks, final readout, decoding">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
  <g fill="#f6f6f6" stroke="#333" stroke-width="1.5">
    <rect x="10" y="60" width="130" height="70" rx="8"/>
    <rect x="175" y="60" width="130" height="70" rx="8"/>
    <rect x="340" y="40" width="200" height="110" rx="8" fill="#e8f0fb"/>
    <rect x="575" y="60" width="130" height="70" rx="8"/>
    <rect x="740" y="60" width="150" height="70" rx="8"/>
  </g>
  <g fill="#111" text-anchor="middle">
    <text x="75" y="92">Logical gates</text><text x="75" y="112" font-size="14">on logical 0 and 1</text>
    <text x="240" y="92">Encode</text><text x="240" y="112" font-size="14">each block, 7 qubits</text>
    <text x="440" y="66">Repeat R times</text>
    <text x="440" y="92" font-size="14">data noise, then</text>
    <text x="440" y="110" font-size="14">12 checks, one by one</text>
    <text x="440" y="132" font-size="14">(one reused ancilla)</text>
    <text x="640" y="92">Final readout</text><text x="640" y="112" font-size="14">14 data qubits</text>
    <text x="815" y="92">Decode</text><text x="815" y="112" font-size="14">and judge the shot</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="142" y1="95" x2="172" y2="95"/>
    <line x1="307" y1="95" x2="337" y2="95"/>
    <line x1="542" y1="95" x2="572" y2="95"/>
    <line x1="707" y1="95" x2="737" y2="95"/>
  </g>
  <text x="440" y="192" text-anchor="middle" font-size="14" fill="#555">the shot is the whole box sequence, played once per shot in one job</text>
</svg>
