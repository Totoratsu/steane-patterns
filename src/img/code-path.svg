<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="sans-serif" font-size="15" role="img" aria-label="Code path of one Run: page, entry point (Qollab or local server), bridge.run, build circuits, one backend job, decoders, JSON back to the page and drawing">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
  <g fill="#f6f6f6" stroke="#333" stroke-width="1.5">
    <rect x="10" y="20" width="190" height="60" rx="8"/><rect x="235" y="20" width="190" height="60" rx="8"/>
    <rect x="460" y="20" width="190" height="60" rx="8"/><rect x="685" y="20" width="200" height="60" rx="8"/>
    <rect x="10" y="150" width="190" height="60" rx="8"/><rect x="235" y="150" width="190" height="60" rx="8"/>
    <rect x="460" y="150" width="190" height="60" rx="8"/><rect x="685" y="150" width="200" height="60" rx="8"/>
  </g>
  <g fill="#111" text-anchor="middle">
    <text x="105" y="44">Page: index.html</text><text x="105" y="62">ui.js (you press Run)</text>
    <text x="330" y="44">Entry: main.js</text><text x="330" y="62">Qollab, or scripts/serve.py</text>
    <text x="555" y="44">engine/bridge.py</text><text x="555" y="62">run(): checks caps, one job</text>
    <text x="785" y="44">engine/circuit.py</text><text x="785" y="62">build(): one circuit per shot</text>
    <text x="105" y="174">Backend: Qiskit simulator</text><text x="105" y="192">one job, one shot per circuit</text>
    <text x="330" y="174">engine/decoders.py</text><text x="330" y="192">BP and Relay-BP per block</text>
    <text x="555" y="174">JSON back to the page</text><text x="555" y="192">shots, rates, histogram</text>
    <text x="785" y="174">ui.js draws</text><text x="785" y="192">grid, triangles, stats</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="202" y1="50" x2="232" y2="50"/><line x1="427" y1="50" x2="457" y2="50"/><line x1="652" y1="50" x2="682" y2="50"/>
    <path d="M785 82 V118 H105 V147"/>
    <line x1="202" y1="180" x2="232" y2="180"/><line x1="427" y1="180" x2="457" y2="180"/><line x1="652" y1="180" x2="682" y2="180"/>
  </g>
  <text x="450" y="238" text-anchor="middle" font-size="14" fill="#555">Only the Python engine runs the quantum part; the page only draws what comes back.</text>
</svg>
